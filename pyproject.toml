[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "probeflow"
version = "0.1.0"
description = "API contracts, retrieval evaluation and bounded LLM-assisted defect investigation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1",
  "pydantic>=2.9,<3", "PyYAML>=6,<7", "defusedxml>=0.7,<1", "langgraph>=1,<2",
  "langchain-core>=1,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "schemathesis>=4,<6"]

[project.scripts]
probeflow = "probeflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

